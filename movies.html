<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yunes Mallail | Movie Night</title>
    <link rel="stylesheet" href="./movies.css">
</head>
<body>
    <header>
        <h1>Movie Night</h1>
        <nav>
            <button class="nav-btn">Popular</button>
            <button class="nav-btn">Top Rated</button>
            <button class="nav-btn">Upcoming</button>
        </nav>
    </header>
    <main>
        <section id="featured">
            <h2>Featured Tonight</h2>
        </section>

        <div class="loader"></div>
        <section class="movie-grid">
            <div class="card">
                <div class="poster"></div>
                <h3>The Godfather</h3>
                <p class="rating high">9.2</p>
            </div>
        </section>

        <div class="loader"></div>
        <section class="movie-grid">
            <div class="card">
                <div class="poster"></div> 
                <h3>Foodfight!</h3>
                <p class="rating low">1.3</p>
            </div>
        </section>

        <div class="loader"></div>
        <section class="movie-grid">
            <div class="card">
                <div class="poster"></div>
                <h3>A GOOD MOVIE THAT IS WORTH YOUR TIME</h3>
                <p class="rating high">8.7</p>
            </div>
            
        </section>

        <div class="loader"></div>
        <section class="movie-grid">
            <div class="card">
                <div class="poster"></div>
                <h3>Untitled Ilia Topuria Movie</h3>
                <p class="rating high">10</p>
            </div>
        </section>
    </main>
</body>
</html>
