<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Night</title>
    <link rel="stylesheet" href="movies.css">
</head>
<body>
    <header>
        <h1>Movie Night</h1>
        <nav>
            <button class="nav-btn">Popular</button>
            <button class="nav-btn">Top Rated</button>
            <button class="nav-btn">Upcoming</button>
        </nav>
    </header>

    <main>
        <section id="featured">
            <h2>Featured tonight</h2>
            <div class="loader"></div>
        </section>

        <section class="movie-grid">
            <div class="card">
                <div class="poster"></div>
                <h3>JBG = Law</h3>
                <p class="rating high">8.5</p>
            </div>

            <div class="card">
                <div class="poster"></div>
                <h3>El Matador</h3>
                <p class="rating high">9.1</p>
            </div>

            <div class="card">
                <div class="poster"></div>
                <h3>Los Conquistadores de América</h3>
                <p class="rating high">7.8</p>
            </div>

            <div class="card">
                <div class="poster"></div>
                <h3>Dagestan</h3>
                <p class="rating low">1.2</p>
            </div>
        </section>
    </main>
    <script src="./movies.js"></script>
</body>
</html>
